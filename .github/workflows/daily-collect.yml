name: 공시 일별 수집

# 반기·사업보고서는 회사별로 며칠에 걸쳐 올라오고 OpenDART API 반영에도 시차가
# 있다. 매일 한 번 돌려서 새로 올라온 것만 붙인다. --merge 라서 아직 안 올라온
# 회사의 기존 데이터는 지워지지 않는다.
on:
  schedule:
    - cron: "0 21 * * *" # UTC 21:00 = KST 06:00
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: DART 인증키 주입
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then
            echo "::error::DART_API_KEY 시크릿이 설정되지 않았습니다."
            exit 1
          fi
          echo "DART_API_KEY=$DART_API_KEY" > .env.local

      - name: 보수 총액 수집
        run: pnpm collect --merge

      - name: 종류별 내역 붙이기
        run: pnpm enrich --only-missing

      - name: 변경분 커밋
        run: |
          rm -f .env.local
          if git diff --quiet -- data/; then
            echo "새로 올라온 공시가 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "공시 일별 수집 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push
